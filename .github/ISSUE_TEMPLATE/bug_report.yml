name: Bug report
description: Report a reproducible problem using synthetic or non-critical data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload real transfer packages, conversations, full local paths, credentials, tokens, cookies, keys, or private configuration. Report security vulnerabilities through the private security advisory link instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple silicon
        - Windows x64
        - Other source build
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Transfer route
      options:
        - Codex to Codex
        - Claude Code to Claude Code
        - Codex to Claude Code
        - Claude Code to Codex
        - Not route-specific
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic paths and conversation content only.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only logs or screenshots that contain no private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real conversations, full local paths, account data, credentials, tokens, cookies, and keys.
          required: true
